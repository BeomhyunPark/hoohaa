<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<link rel="icon" href="data:,"><title>러닝 티어</title>
<style>
:root{--bg:#0E1116;--surface:#171B22;--raised:#20262F;--t1:#F2F4F7;--t2:#B3BAC5;--t3:#8790A0;--border:#2C333E;--border2:#5A6474;--accent:#C6F432;--accent-h:#D8FF5C;--on-accent:#0E1116;--focus:#7CC4FF;--danger:#FF6B6B;--r:14px;--pad:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--t1)}
body{font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.num,.big,input,.time,.pace,.gap,.pct{font-variant-numeric:tabular-nums}
main{max-width:430px;margin:0 auto;padding:0 var(--pad) calc(200px + env(safe-area-inset-bottom))}
.top{padding:24px 0 8px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.sub{margin:0;color:var(--t2);font-size:14px}
.field{margin:20px 0}
.lbl{display:block;font-size:14px;font-weight:600;color:var(--t2);margin-bottom:8px}
.lbl.sm{font-size:13px}
input{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--t1);font-size:18px;font-family:inherit}
input::placeholder{color:var(--t3)}
input.big{font-size:28px;font-weight:700;min-height:60px;letter-spacing:.02em}
input[type=file]{padding:12px;font-size:14px;min-height:52px}
input[type=date]{color-scheme:dark}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 2px var(--focus)}
input[aria-invalid=true]{border-color:var(--danger)}
.hint{margin:6px 2px 0;font-size:13px;color:var(--t3)}
.hint.bad{color:var(--danger)}
.sub-field{margin-top:12px}
.suffix{position:relative}.suffix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--t2)}
.chips{display:grid;gap:8px}.chips.five{grid-template-columns:repeat(5,1fr)}.chips.two{grid-template-columns:1fr 1fr}
.chips button{min-height:48px;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--t1);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;padding:0 4px}
.chips button[aria-checked=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.err{color:var(--danger);font-size:15px;min-height:1px;margin:8px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,rgba(14,17,22,0));padding:16px var(--pad) calc(16px + env(safe-area-inset-bottom))}
.bar>div{max-width:398px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.btn{min-height:52px;border-radius:14px;font-size:17px;font-weight:700;font-family:inherit;border:0;cursor:pointer;width:100%}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-h)}
.btn.primary:disabled{background:var(--raised);color:var(--t3);cursor:not-allowed}
.btn.secondary{background:transparent;color:var(--t1);border:1px solid var(--border2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:12px 0}
.card h2{font-size:15px;color:var(--t2);margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:6px}
.note{color:var(--t2);font-size:14px}
/* progress */
.prog .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog .gap{font-size:19px;font-weight:800;word-break:keep-all}
.prog .tgt{color:var(--t2);font-size:14px;white-space:nowrap}
.track{height:10px;border-radius:6px;background:var(--raised);margin:12px 0 6px;overflow:hidden}
.track>div{height:100%;border-radius:6px;background:var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--t3)}
.congrats{font-size:17px;font-weight:700;margin:0}
/* vdot */
.vdot .val{font-size:40px;font-weight:800;line-height:1}
.info{min-width:44px;min-height:44px;margin:-12px -12px -12px auto;background:none;border:0;color:var(--t2);font-size:20px;cursor:pointer;font-family:inherit}
.more{color:var(--t2);font-size:14px;margin:10px 0 0}
/* predicted grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--raised);border-radius:12px;padding:12px;border:1px solid transparent}
.cell.me{border-color:var(--accent)}
.cell .ev{font-size:13px;color:var(--t2);display:flex;justify-content:space-between}
.cell .ev em{font-style:normal;color:var(--accent);font-weight:700}
.cell .time{font-size:22px;font-weight:800;margin-top:2px}
.cell .pace{font-size:13px;color:var(--t3)}
details.method{margin-top:10px;color:var(--t2);font-size:14px}
details.method summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--t2)}
/* paces */
.prow{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--border);color:var(--t1);font-family:inherit;padding:0;cursor:pointer}
.prow:first-of-type{border-top:0}
.prow .line{display:flex;align-items:center;gap:10px;min-height:52px}
.prow .ltr{width:28px;height:28px;border-radius:8px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--accent);flex:none}
.prow .nm{font-weight:600;flex:1}
.prow .pv{font-weight:700;font-variant-numeric:tabular-nums}
.prow .chev{color:var(--t3);width:16px;text-align:center}
.prow .exp{display:block;color:var(--t2);font-size:14px;padding:0 0 12px 38px}

/* hide caret-browsing cursor outside inputs */
body{caret-color:transparent}
input,textarea{caret-color:auto}
/* explanation boxes: visually distinct from main content */
.more,details.method p,.prow .exp{background:var(--raised);border-left:3px solid var(--accent);border-radius:8px;color:var(--t2);font-size:13px;line-height:1.55;padding:10px 12px;margin:8px 0 12px}
.prow .exp{margin:0 0 12px 38px}
details.method summary{color:var(--t3);font-size:13px}
/* pace intensity colors: cool -> hot */
.prow:nth-of-type(1){--pc:#4FC3F7}.prow:nth-of-type(2){--pc:#4ADE80}.prow:nth-of-type(3){--pc:#FACC15}.prow:nth-of-type(4){--pc:#FB923C}.prow:nth-of-type(5){--pc:#F87171}
.prow .ltr{color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,transparent)}
.prow .exp{border-left-color:var(--pc)}
.prow .exp{margin:0 0 12px 0}

/* 꾸미기 (선택) */
.deco{margin:12px 0;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.deco summary{list-style:none;cursor:pointer;min-height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;color:var(--t1)}
.deco summary::-webkit-details-marker{display:none}
.deco summary em{font-style:normal;color:var(--t3);font-weight:500}
.deco summary .dsub{color:var(--t3);font-size:13px;font-weight:500}
.deco summary .dsub::after{content:"▾";margin-left:8px}
.deco[open] summary .dsub::after{content:"▴"}
.deco-in{padding:0 16px 16px}
.dnote{margin:0 0 4px;color:var(--t3);font-size:13px}
.dfield{margin-top:14px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.photo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pick{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border2);color:var(--t1);font-weight:600;font-size:15px;cursor:pointer}
.photo-row:focus-within .pick{outline:2px solid var(--focus)}
#preview{width:44px;height:44px;object-fit:cover;border-radius:10px;margin:0;max-width:none}
.ghost{min-height:44px;background:none;border:0;color:var(--t2);font-size:14px;font-family:inherit;cursor:pointer;text-decoration:underline}

/* template picker */
.tpl-prev{display:flex;justify-content:center;margin-bottom:14px}
#tplPreview{width:min(70%,260px);height:auto;aspect-ratio:9/16;border-radius:14px;background:var(--raised);box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.tpl-list{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.tpl-btn{flex:1 1 0;min-width:64px;scroll-snap-align:start;background:none;border:0;padding:0;color:var(--t2);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.tpl-btn canvas{width:100%;height:auto;aspect-ratio:9/16;border-radius:10px;background:var(--raised);outline:2px solid transparent;outline-offset:2px;transition:outline-color .15s}
.tpl-btn[aria-checked=true] canvas{outline-color:var(--accent)}
.tpl-btn[aria-checked=true] .tn{color:var(--t1);font-weight:700}
.tpl-btn .tn{font-size:13px;font-weight:600}
.tpl-btn .th{font-size:11px;color:var(--t3);line-height:1.2;text-align:center;margin-top:-4px}
.who-line{margin:12px 2px 0;text-align:center;color:var(--t2);font-size:15px;font-weight:500}
.who-line b{color:var(--t1);font-weight:700}
#tplPreview.editable{touch-action:none;cursor:grab}
#tplPreview.editable:active{cursor:grabbing}
.adj{margin:-2px 0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--raised);border-radius:12px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:none;color:var(--t2);font:600 14px/1 inherit;font-family:inherit;cursor:pointer}
.seg button[aria-checked=true]{background:var(--surface);color:var(--t1);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.adj-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.adj-row .lbl{margin:0;white-space:nowrap;min-width:56px}
.adj-row input[type=range]{flex:1;min-height:44px;padding:0;border:0;background:none;accent-color:var(--accent)}
.adj .hint{text-align:center}
.cpick{margin-top:12px}
.cp-top{display:flex;align-items:center;gap:6px}
.cp-top .lbl{margin:0 auto 0 0}
.qc{width:44px;height:44px;border:0;padding:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle,var(--c) 0 13px,var(--border2) 13.5px 15px,transparent 15.5px)}
.qc[aria-pressed=true]{background:radial-gradient(circle,var(--c) 0 13px,var(--bg) 13.5px 15.5px,var(--accent) 16px 18px,transparent 18.5px)}
.cp-chip{width:28px;height:28px;border-radius:8px;border:1px solid var(--border2);flex:none;margin-left:4px}
.cp-hex{width:104px;min-height:44px;height:44px;font-size:15px;padding:0 10px;font-variant-numeric:tabular-nums;letter-spacing:.04em;text-transform:uppercase}
.cp-sv{position:relative;height:150px;margin-top:10px;border-radius:12px;touch-action:none;cursor:crosshair;
  background:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,var(--hue,red))}
.cp-sv i,.cp-hue i{position:absolute;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.cp-hue{position:relative;height:28px;margin:14px 12px 4px;border-radius:14px;touch-action:none;cursor:pointer;
  background:linear-gradient(to right,#f00,#ff0 16.7%,#0f0 33.3%,#0ff 50%,#00f 66.7%,#f0f 83.3%,#f00)}
.cp-hue i{top:50%;background:transparent}
.cp-sv:focus-visible,.cp-hue:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* overlay editor */
.tpl-ed.editing .ed-head{position:sticky;top:0;z-index:5;background:var(--surface);margin:0 -16px;padding:8px 16px 6px;border-radius:0 0 14px 14px;box-shadow:0 8px 16px -12px rgba(0,0,0,.6)}
.tpl-ed.editing .tpl-prev{margin-bottom:8px}
.tpl-prev{position:relative}
.tpl-ed.editing #tplPreview{width:auto;height:min(40vh,340px)}
.add-photo{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 18px;min-height:44px;border-radius:14px;border:2px dashed rgba(255,255,255,.75);background:rgba(14,17,22,.55);color:#fff;font:700 16px/1.2 inherit;font-family:inherit;cursor:pointer;backdrop-filter:blur(4px)}
.add-photo .ap-plus{font-size:26px;line-height:1}
.add-photo small{font-size:11px;font-weight:500;opacity:.8}
.ed{margin:4px 0 14px}
.ed-tabs{display:flex;gap:2px;background:var(--raised);border-radius:12px;padding:3px;overflow-x:auto}
.ed-tabs [role=tab]{flex:1 0 auto;min-height:44px;padding:0 10px;border:0;border-radius:9px;background:none;color:var(--t2);font:600 14px inherit;font-family:inherit;cursor:pointer}
.ed-tabs [role=tab][aria-selected=true]{background:var(--surface);color:var(--t1)}
.ed-tabs [role=tab]:disabled{opacity:.4;cursor:not-allowed}
.ed-reset{flex:none;min-height:44px;padding:0 10px;border:0;background:none;color:var(--t3);font:500 13px inherit;font-family:inherit;cursor:pointer;text-decoration:underline}
.ed-panel{padding:10px 2px 0;min-height:150px}
.ed-panel .adj-row{margin-top:2px}
.ed-panel output{min-width:44px;text-align:right;color:var(--t2);font-size:13px;font-variant-numeric:tabular-nums}
.ed-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip-btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border2);background:none;color:var(--t1);font:600 14px inherit;font-family:inherit;cursor:pointer}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.tgl{display:flex;flex-wrap:wrap;gap:6px}
.tg{min-height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--border2);background:none;color:var(--t2);font:600 13px inherit;font-family:inherit;cursor:pointer}
.tg[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tg:disabled{opacity:.4;cursor:not-allowed}
.ed-panel .cp-sv{height:96px;margin-top:6px}
.ed-panel .cp-hue{margin:10px 12px 0}
.ed-panel .cpick{margin-top:0}
.primary-chip{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ed{margin:2px 0 14px}

</style>

.tier-card{
  /* per-tier knobs */
  --c1:#555;--c2:#444;--c3:#333;     /* gradient stops */
  --ink:#fff;--ink2:rgba(255,255,255,.62);
  --sheen:0;      /* 0..1 specular highlight */
  --grain:0;      /* 0..1 fine noise */
  --holo:0;       /* 0..1 iridescent layer */
  --glow:transparent; --glow-size:0px;
  --edge:rgba(255,255,255,.08);
  position:relative;isolation:isolate;overflow:hidden;
  width:100%;max-width:340px;aspect-ratio:1.586;  /* ID-1 card ratio */
  border-radius:20px;padding:20px 22px;box-sizing:border-box;
  display:flex;flex-direction:column;justify-content:space-between;
  color:var(--ink);
  background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 52%,var(--c3) 100%);
  box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 rgba(255,255,255,calc(.06 + var(--sheen)*.3)),
             0 10px 30px -12px rgba(0,0,0,.6),0 0 var(--glow-size) calc(var(--glow-size)*-.35) var(--glow);
  font-family:"TC Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* specular sheen: soft diagonal band + top-left bloom */
.tier-card::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:var(--sheen);
  background:
    linear-gradient(115deg,transparent 30%,rgba(255,255,255,.38) 45%,rgba(255,255,255,.06) 52%,transparent 64%),
    radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.35),transparent 55%),
    radial-gradient(90% 80% at 100% 100%,rgba(0,0,0,.28),transparent 60%);
  mix-blend-mode:soft-light;
}
.tier-card::after{ /* brushed-metal micro texture, strength = --grain */
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:var(--grain);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 2px,rgba(0,0,0,.03) 2px 3px,transparent 3px 5px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;-webkit-mask:none;
}
.tier-card .tc-holo{position:absolute;inset:-40%;z-index:-1;pointer-events:none;opacity:var(--holo);
  background:linear-gradient(105deg,transparent 15%,#ff9fd6 28%,#ffe08a 38%,#a6ffc0 48%,#7fe6ff 58%,#a798ff 68%,transparent 82%);
  mix-blend-mode:overlay;filter:saturate(1.15)}

.tc-top{display:flex;justify-content:space-between;align-items:center}
.tc-label{font-family:"TC Archivo";font-stretch:110%;font-weight:600;font-size:9.5px;letter-spacing:.22em;color:var(--ink2)}
.tc-ko{font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--ink2)}
.tc-name{display:flex;align-items:baseline;gap:10px;line-height:.9;margin-top:auto;margin-bottom:12px}
.tc-name .w{font-family:"TC Archivo";font-weight:800;font-stretch:118%;font-size:30px;letter-spacing:-.015em;white-space:nowrap}
.tc-name .n{font-family:"TC Archivo";font-weight:300;font-stretch:118%;font-size:30px;letter-spacing:.02em;opacity:.7}
.tc-name.long .w{font-size:22px}
.tc-name.long .n{font-size:22px}
.tc-meta{display:flex;justify-content:space-between;align-items:flex-end;padding-top:11px;
  border-top:1px solid color-mix(in srgb,var(--ink) 16%,transparent);font-size:11.5px;font-weight:500;color:var(--ink2)}
.tc-meta .rec{font-family:"TC Archivo";font-stretch:100%;font-weight:600;font-size:12px;letter-spacing:.01em;color:var(--ink);font-variant-numeric:tabular-nums}
.tc-meta .rank b{color:var(--ink);font-weight:700}

/* ---- Tiers: material escalates ---- */
.t-iron{--c1:#4a4f57;--c2:#454a52;--c3:#40444b;--ink:#e9ebee;--ink2:rgba(233,235,238,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 10px 30px -12px rgba(0,0,0,.6)}
.t-bronze{--c1:#9a6a4c;--c2:#7a4e36;--c3:#5c3826;--sheen:.25;--grain:.3;--ink:#fff3ea;--ink2:rgba(255,243,234,.62)}
.t-silver{--c1:#e3e7ec;--c2:#aeb5be;--c3:#878f9a;--sheen:.45;--grain:.4;--ink:#1b1f26;--ink2:rgba(27,31,38,.6);--edge:rgba(255,255,255,.35)}
.t-gold{--c1:#f6dc8e;--c2:#d4a747;--c3:#9e7426;--sheen:.55;--grain:.45;--ink:#2a1d05;--ink2:rgba(42,29,5,.62);--edge:rgba(255,240,200,.4);--glow:rgba(230,180,70,.35);--glow-size:22px}
.t-platinum{--c1:#9fe3dc;--c2:#4fb3ad;--c3:#2a7f80;--sheen:.6;--grain:.5;--ink:#06231f;--ink2:rgba(6,35,31,.62);--edge:rgba(210,255,250,.4);--glow:rgba(80,200,190,.4);--glow-size:26px}
.t-emerald{--c1:#3fd68a;--c2:#13a05e;--c3:#0a6a3e;--sheen:.65;--grain:.5;--holo:.08;--ink:#eafff3;--ink2:rgba(234,255,243,.68);--edge:rgba(190,255,220,.35);--glow:rgba(40,210,120,.45);--glow-size:30px}
.t-diamond{--c1:#b9d4ff;--c2:#5a8cf0;--c3:#3a4fc4;--sheen:.75;--grain:.5;--holo:.18;--ink:#fff;--ink2:rgba(255,255,255,.72);--edge:rgba(220,235,255,.45);--glow:rgba(100,150,255,.5);--glow-size:34px}
.t-master{--c1:#d9a8ff;--c2:#9a52e6;--c3:#5a24a8;--sheen:.8;--grain:.55;--holo:.25;--ink:#fff;--ink2:rgba(255,255,255,.72);--edge:rgba(240,220,255,.45);--glow:rgba(170,90,255,.55);--glow-size:38px}
.t-grandmaster{--c1:#ff9c8a;--c2:#e2384a;--c3:#8e1530;--sheen:.85;--grain:.55;--holo:.3;--ink:#fff;--ink2:rgba(255,255,255,.74);--edge:rgba(255,220,215,.45);--glow:rgba(255,70,80,.55);--glow-size:42px}
.t-challenger{--c1:#fff2c4;--c2:#a6f0ff;--c3:#c9a8ff;--sheen:.9;--grain:.6;--holo:.95;--ink:#14121f;--ink2:rgba(20,18,31,.62);--edge:rgba(255,255,255,.7);--glow:rgba(200,225,255,.85);--glow-size:56px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 1px 0 #fff,0 10px 30px -12px rgba(0,0,0,.6),-14px 0 44px -16px rgba(255,150,220,.7),14px 0 44px -16px rgba(110,220,255,.75),0 0 56px -18px rgba(220,230,255,.9);
  background:linear-gradient(125deg,#fff3c8 0%,#ffc9ec 25%,#c7d2ff 50%,#a8f3ff 72%,#d9ffcf 100%)}
.t-challenger .tc-holo{mix-blend-mode:soft-light}

/* ---- app integration: fluid sizing via container units ---- */
.tier-card.fluid{max-width:440px;margin:16px auto 0;container-type:inline-size;padding:6% 6.5%;border-radius:clamp(18px,5.5cqw,24px)}
.tier-card.fluid .tc-label{font-size:clamp(9px,2.8cqw,11px)}
.tier-card.fluid .tc-ko{font-size:clamp(13px,4cqw,16px)}
.tier-card.fluid .tc-name{gap:2.8cqw;margin-bottom:3.5cqw}
.tier-card.fluid .tc-name .w,.tier-card.fluid .tc-name .n{font-size:10cqw}
.tier-card.fluid .tc-name.long .w,.tier-card.fluid .tc-name.long .n{font-size:7.6cqw}
.tier-card.fluid .tc-meta{font-size:clamp(12px,3.7cqw,15px);padding-top:3.4cqw;gap:8px}
.tier-card.fluid .tc-meta .rec{margin:0;font-size:clamp(12px,3.8cqw,15px)}
.tier-card.fluid .tc-meta .rank{white-space:nowrap}

</style>
</head><body>

// snapping: group centre -> canvas centre; edges -> safe margins
const SNAP = 26, SAFE_X = 60, SAFE_Y = 250;
function snapText(tx, ty) {
  const b = lastBox; if (!b) return { tx, ty, g: null };
  const w = b.w, h = b.h, gx = 540 + tx, gy = 960 + ty, gX = [], gY = [];
  const cx = [[540, 540, 540], [SAFE_X + w / 2, SAFE_X, SAFE_X], [1080 - SAFE_X - w / 2, 1080 - SAFE_X, 1080 - SAFE_X], [40 + w / 2, 40, 40], [1040 - w / 2, 1040, 1040]];
  let nx = gx; for (const [t, line] of cx) if (Math.abs(gx - t) < SNAP) { nx = t; gX.push(line); break; }
  const cy = [[960, 960], [SAFE_Y + h / 2, SAFE_Y], [1920 - SAFE_Y - h / 2, 1920 - SAFE_Y]];
  let ny = gy; for (const [t, line] of cy) if (Math.abs(gy - t) < SNAP) { ny = t; gY.push(line); break; }
  return { tx: nx - 540, ty: ny - 960, g: gX.length || gY.length ? { x: gX, y: gY } : { x: [], y: [] } };
}
{

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h, w, a) => '#' + hex(h).map((c, i) => Math.round(c * (1 - a) + hex(w)[i] * a).toString(16).padStart(2, '0')).join('');
const rgba = (h, a) => `rgba(${hex(h).join(',')},${a})`;
function tierStyle(name) {
  const [major, div] = name.split(' '), key = KEY[major], tk = TK.tier[key];

  if (roman === 'III') stops = stops.map(c => mix(c, '#000000', 0.12));
  if (roman === 'I') stops = stops.map(c => mix(c, '#FFFFFF', 0.14));
  const grad = tk.gradient_angle_deg === 'conic' ? `conic-gradient(from 200deg, ${stops.join(',')}, ${stops[0]})` : `linear-gradient(${tk.gradient_angle_deg}deg, ${stops.join(',')})`;
  const base = roman && tk.divisions ? tk.divisions[roman] : tk.base;
  return { key, roman, pips: roman ? { III: 1, II: 2, I: 3 }[roman] : 0,
    css: `--grad:${grad};--on:${tk.on};--tier:${base};--tier-text:${tk.tint_text.dark};--tint:${tk.tint.dark};--glow:${rgba(tk.glow.color, tk.glow.alpha)};--glow-blur:${Math.max(tk.glow.blur_px, 2)}px` };
}
